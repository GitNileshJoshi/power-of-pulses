function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function parseTerms(){return $('q').value.toLowerCase().split(/[ ,;+]+/).map(s=>s.trim()).filter(Boolean);}
function dishType(r){const n=r.name.toLowerCase(),c=(r.category||'').toLowerCase();if(c==='breakfast')return 'Breakfast';if(c==='dessert'||/brownie|cookie|blondie|pie|cake|gingersnap/.test(n))return 'Dessert';if(/soup|stew|chili|watt|curry/.test(n))return 'Soup';if(/salad|slaw|caviar/.test(n))return 'Salad';if(/hummus|dip|pesto|ranch|dressing|guacamole|broccomole/.test(n))return 'Dip';if(c==='snack')return 'Snack';if(/succotash|curtido|kale chips/.test(n))return 'Side';return 'Main';}
function recipeText(r){return [r.name,r.category,r.difficulty,dishType(r),...(r.ingredients||[])].join(' ').toLowerCase();}
function getFiltered(){const terms=parseTerms(),mode=$('match').value,cat=$('cat').value,dish=$('dish').value,diff=$('diff').value,max=Number($('time').value)||9999;return recipes.filter(r=>{const hay=recipeText(r);const textOK=!terms.length||(mode==='all'?terms.every(t=>hay.includes(t)):terms.some(t=>hay.includes(t)));return textOK&&(!cat||r.category===cat)&&(!dish||dishType(r)===dish)&&(!diff||r.difficulty===diff)&&Number(r.minutes)<=max;});}
function renderChips(){const terms=parseTerms();$('chips').innerHTML=terms.map(t=>`<button class="chip" type="button" data-remove="${escapeHtml(t)}">${escapeHtml(t)} ×</button>`).join('');}
function render(){const list=getFiltered();$('status').textContent=`${list.length} of ${recipes.length} recipes found`;$('grid').innerHTML=list.length?list.map(r=>`<article class="card"><img loading="lazy" src="${escapeHtml(r.image)}" alt="${escapeHtml(r.name)}"><div class="body"><div class="tags"><span class="tag">${escapeHtml(r.category)}</span><span class="tag">${escapeHtml(dishType(r))}</span><span class="tag">${escapeHtml(r.difficulty)}</span><span class="tag">${escapeHtml(r.minutes)} min</span></div><h2>${escapeHtml(r.name)}</h2><p class="ingredients">${escapeHtml((r.ingredients||[]).join(' • '))}</p><button class="primary" type="button" data-open="${escapeHtml(r.id)}">View recipe & plan</button></div></article>`).join(''):'<div class="empty">No matching recipes. Try Match ANY or remove one search term.</div>';renderChips();}
function openRecipe(id){activeRecipe=recipes.find(r=>r.id===id);if(!activeRecipe)return;$('detailName').textContent=activeRecipe.name;$('detailImg').src=activeRecipe.image;$('detailImg').alt=activeRecipe.name;$('detailMeta').innerHTML=`<span class="tag">${escapeHtml(activeRecipe.category)}</span><span class="tag">${escapeHtml(dishType(activeRecipe))}</span><span class="tag">${escapeHtml(activeRecipe.difficulty)}</span><span class="tag">${escapeHtml(activeRecipe.minutes)} min</span>`;$('detailIngredients').textContent=(activeRecipe.ingredients||[]).join(' • ');let saved={};try{saved=JSON.parse(localStorage.getItem('pulse-plan-'+id)||'{}')}catch(e){}$('prepDate').value=saved.prepDate||'';$('madeDate').value=saved.madeDate||'';$('notes').value=saved.notes||'';$('dlg').showModal();}
function savePlan(){if(!activeRecipe)return;const data={prepDate:$('prepDate').value,madeDate:$('madeDate').value,notes:$('notes').value};localStorage.setItem('pulse-plan-'+activeRecipe.id,JSON.stringify(data));$('saveBtn').textContent='Saved ✓';setTimeout(()=>$('saveBtn').textContent='Save plan',1200);}
function icsEscape(s){return String(s||'').split('\\').join('\\\\').split(',').join('\\,').split(';').join('\\;').replace(/\r?\n/g,'\\n');}
function exportCalendar(){
  if(!activeRecipe)return;
  const date=$('prepDate').value;
  if(!date){alert('Choose a Plan to prepare on date first.');$('prepDate').focus();return;}
  const parts=date.split('-').map(Number);
  const next=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]+1));
  const pad=n=>String(n).padStart(2,'0');
  const start=date.replaceAll('-','');
  const end=String(next.getUTCFullYear())+pad(next.getUTCMonth()+1)+pad(next.getUTCDate());
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
  const lines=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Power of Pulses//Recipe Planner//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+activeRecipe.id+'-'+Date.now()+'@powerofpulses','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+start,'DTEND;VALUE=DATE:'+end,
    'SUMMARY:'+icsEscape('Prepare '+activeRecipe.name),'DESCRIPTION:'+icsEscape($('notes').value||'Power of Pulses recipe'),
    'END:VEVENT','END:VCALENDAR'
  ];
  const blob=new Blob([lines.join(String.fromCharCode(13,10))],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob), link=document.createElement('a');
  link.href=url;
  link.download=activeRecipe.name.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()+'.ics';
  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function clearSearch(){$('q').value='';$('match').value='all';$('cat').value='';$('dish').value='';$('diff').value='';$('time').value='9999';render();}
[...new Set(recipes.map(r=>r.category))].filter(Boolean).sort().forEach(c=>{const o=document.createElement('option');o.textContent=c;o.value=c;$('cat').appendChild(o);});
$('searchBtn').addEventListener('click',render);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();render();}});
$('q').addEventListener('input',render);
['match','cat','dish','diff','time'].forEach(id=>$(id).addEventListener('change',render));
$('clearBtn').addEventListener('click',clearSearch);
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;const remove=b.dataset.remove;$('q').value=parseTerms().filter(t=>t!==remove).join(' ');render();});
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openRecipe(b.dataset.open);});
$('closeBtn').addEventListener('click',()=>$('dlg').close());
$('saveBtn').addEventListener('click',savePlan);
$('calendarBtn').addEventListener('click',exportCalendar);
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close();});
render();
</script>
</body></html>
