<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Power of Pulses</title>
<style>
:root{--cream:#fffaf0;--ink:#243126;--green:#39714c;--orange:#a94319;--line:#d9ccb7;--soft:#eef5e9}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}header{padding:34px 20px;background:linear-gradient(120deg,#f4db82,#dff0ad)}.wrap{max-width:1120px;margin:auto}h1{font-size:clamp(2.3rem,6vw,4rem);margin:0;color:var(--orange)}header p{font-size:1.05rem}.searchPanel{padding:20px;margin:22px 0;border:1px solid var(--line);background:#fff;border-radius:16px}.searchRow{display:grid;grid-template-columns:2fr auto 1fr;gap:10px}.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}input,select,button,textarea{font:inherit;border:1px solid #c9bca7;border-radius:10px;padding:11px}button{cursor:pointer}.primary{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}.primary:hover{background:#2e603f}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{background:#e8f1e4;border:1px solid #b8d0b2;padding:6px 9px}.status{padding:12px 0;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;padding-bottom:40px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 14px #00000012}.card img{width:100%;height:190px;object-fit:cover;object-position:top;background:#eee}.body{padding:15px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:var(--soft);border-radius:999px;padding:4px 8px;font-size:.8rem}.ingredients{font-size:.88rem;color:#536052;min-height:2.4em}.empty{padding:30px;background:#fff;border:1px dashed var(--line);border-radius:12px}dialog{border:0;border-radius:16px;padding:0;width:min(920px,96vw);max-height:92vh;box-shadow:0 20px 70px #0007}dialog::backdrop{background:#0008}.modal{display:grid;grid-template-columns:1.2fr .8fr}.modal img{width:100%;height:82vh;object-fit:contain;background:#eee}.panel{padding:22px;overflow:auto}.panel label{display:block;font-weight:700;margin:12px 0 5px}.panel input,.panel textarea{width:100%}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.close{float:right}.calendarBox{background:var(--soft);padding:14px;border-radius:12px;margin-top:16px}.hint{font-size:.87rem;color:#536052}footer{background:#263a2b;color:white;padding:25px 20px}@media(max-width:760px){.searchRow,.filters{grid-template-columns:1fr}.modal{grid-template-columns:1fr}.modal img{height:40vh}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Power of Pulses</h1><p>Search recipes by name or multiple ingredients, then plan a preparation date and export it to your calendar.</p></div></header>
<main class="wrap">
<section class="searchPanel">
<label for="q"><strong>Recipe / ingredient search</strong></label>
<div class="searchRow"><input id="q" placeholder="Example: beans garlic spinach" autocomplete="off"><button id="searchBtn" class="primary" type="button">Search recipes</button><select id="match"><option value="all">Match ALL terms</option><option value="any">Match ANY term</option></select></div>
<div class="filters"><select id="cat"><option value="">All categories</option></select><select id="diff"><option value="">All difficulty levels</option><option>Easy</option><option>Medium</option><option>Hard</option></select><select id="time"><option value="9999">Any cook time</option><option value="15">15 min or less</option><option value="30">30 min or less</option><option value="45">45 min or less</option><option value="60">60 min or less</option></select></div>
<div class="actions"><button id="clearBtn" type="button">Clear search</button></div><div id="chips" class="chips"></div>
</section>
<div id="status" class="status" aria-live="polite"></div><section id="grid" class="grid"></section>
</main>
<dialog id="dlg"><div class="modal"><img id="detailImg" alt="Recipe page"><div class="panel"><button id="closeBtn" class="close" type="button">Close</button><h2 id="detailName"></h2><div id="detailMeta" class="tags"></div><p id="detailIngredients" class="ingredients"></p><div class="calendarBox"><strong>Meal planner</strong><label for="prepDate">Plan to prepare on</label><input id="prepDate" type="date"><label for="madeDate">Made on</label><input id="madeDate" type="date"><label for="notes">Notes</label><textarea id="notes" rows="3" placeholder="Substitutions, rating, reminders"></textarea><div class="actions"><button id="saveBtn" class="primary" type="button">Save plan</button><button id="calendarBtn" class="primary" type="button">Export to Calendar (.ics)</button></div><p class="hint">The .ics file can be imported/opened with Google Calendar, Outlook, or Apple Calendar.</p></div></div></div></dialog>
<footer><div class="wrap">Power of Pulses recipe browser</div></footer>
<script>
'use strict';
const recipes=[{"id":"r001","name":"Simple Frittata","category":"Breakfast","difficulty":"Medium","minutes":15,"page":6,"image":"assets/recipes/page-6.webp","source":"Power of Pulses Recipe Book","ingredients":["simple","frittata"]},{"id":"r002","name":"Luna's Chia Breakfast Bowl","category":"Breakfast","difficulty":"Easy","minutes":15,"page":7,"image":"assets/recipes/page-7.webp","source":"Power of Pulses Recipe Book","ingredients":["luna's","chia","breakfast","bowl"]},{"id":"r003","name":"Cherry Almond Red Lentil Granola Bars","category":"Breakfast","difficulty":"Medium","minutes":30,"page":8,"image":"assets/recipes/page-8.webp","source":"Power of Pulses Recipe Book","ingredients":["cherry","almond","lentil","granola","bars"]},{"id":"r004","name":"Southwest Pinto Bean Succotash","category":"Lunch","difficulty":"Medium","minutes":35,"page":9,"image":"assets/recipes/page-9.webp","source":"Power of Pulses Recipe Book","ingredients":["southwest","pinto","bean","succotash"]},{"id":"r005","name":"Eggless Beet Pasta","category":"Lunch","difficulty":"Hard","minutes":60,"page":10,"image":"assets/recipes/page-10.webp","source":"Power of Pulses Recipe Book","ingredients":["eggless","beet","pasta"]},{"id":"r006","name":"Carrot Top Pesto","category":"Lunch","difficulty":"Medium","minutes":35,"page":11,"image":"assets/recipes/page-11.webp","source":"Power of Pulses Recipe Book","ingredients":["carrot","pesto"]},{"id":"r007","name":"Cowboy Caviar: Black Eyed Peas","category":"Lunch","difficulty":"Medium","minutes":40,"page":12,"image":"assets/recipes/page-12.webp","source":"Power of Pulses Recipe Book","ingredients":["cowboy","caviar","black","eyed","peas"]},{"id":"r008","name":"Chickpea Tu-no Salad","category":"Lunch","difficulty":"Medium","minutes":30,"page":13,"image":"assets/recipes/page-13.webp","source":"Power of Pulses Recipe Book","ingredients":["chickpea","tu-no","salad"]},{"id":"r009","name":"Black Bean Burgers","category":"Lunch","difficulty":"Medium","minutes":35,"pa ,"category":"Dessert","difficulty":"Medium","minutes":30,"page":40,"image":"assets/recipes/page-40.webp","source":"Power of Pulses Recipe Book","ingredients":["black","bean","chocolate","chunk","brownies"]},{"id":"r035","name":"Red Kidney Bean Chocolate Cookies","category":"Dessert","difficulty":"Medium","minutes":30,"page":41,"image":"assets/recipes/page-41.webp","source":"Power of Pulses Recipe Book","ingredients":["kidney","bean","chocolate","cookies"]},{"id":"r036","name":"Black Eyed Peas Brownie Bites","category":"Dessert","difficulty":"Easy","minutes":15,"page":42,"image":"assets/recipes/page-42.webp","source":"Power of Pulses Recipe Book","ingredients":["black","eyed","peas","brownie","bites"]},{"id":"r037","name":"Pinto Bean Pie","category":"Dessert","difficulty":"Medium","minutes":60,"page":43,"image":"assets/recipes/page-43.webp","source":"Power of Pulses Recipe Book","ingredients":["pinto","bean"]},{"id":"r038","name":"Pupusas","category":"Snack","difficulty":"Hard","minutes":75,"page":44,"image":"assets/recipes/page-44.webp","source":"Power of Pulses Recipe Book","ingredients":["pupusas"]},{"id":"r039","name":"Curtido","category":"Snack","difficulty":"Easy","minutes":10,"page":45,"image":"assets/recipes/page-45.webp","source":"Power of Pulses Recipe Book","ingredients":["curtido"]},{"id":"r040","name":"Broccomole","category":"Snack","difficulty":"Easy","minutes":10,"page":46,"image":"assets/recipes/page-46.webp","source":"Power of Pulses Recipe Book","ingredients":["broccomole"]},{"id":"r041","name":"Kale Chips","category":"Snack","difficulty":"Easy","minutes":10,"page":47,"image":"assets/recipes/page-47.webp","source":"Power of Pulses Recipe Book","ingredients":["kale","chips"]},{"id":"r042","name":"Asian Slaw","category":"Snack","difficulty":"Easy","minutes":20,"page":48,"image":"assets/recipes/page-48.webp","source":"Power of Pulses Recipe Book","ingredients":["asian","slaw"]},{"id":"r043","name":"Lentil Fritters","category":"Snack","difficulty":"Medium","minutes":35,"page":49,"image":"assets/recipes/page-49.webp","source":"Power of Pulses Recipe Book","ingredients":["lentil","fritters"]},{"id":"r044","name":"Spicy Hummus Dip: Chickpeas","category":"Snack","difficulty":"Easy","minutes":10,"page":50,"image":"assets/recipes/page-50.webp","source":"Power of Pulses Recipe Book","ingredients":["spicy","hummus","dip","chickpeas"]},{"id":"r045","name":"Peanut Butter Chickpea Energy Balls","category":"Snack","difficulty":"Easy","minutes":10,"page":51,"image":"assets/recipes/page-51.webp","source":"Power of Pulses Recipe Book","ingredients":["peanut","butter","chickpea","energy","balls"]},{"id":"r046","name":"White Bean Dip","category":"Snack","difficulty":"Easy","minutes":10,"page":51,"image":"assets/recipes/page-51.webp","source":"Power of Pulses Recipe Book","ingredients":["white","bean"]},{"id":"r047","name":"Lentil Hummus","category":"Snack","difficulty":"Easy","minutes":10,"page":52,"image":"assets/recipes/page-52.webp","source":"Power of Pulses Recipe Book","ingredients":["lentil","hummus"]},{"id":"r048","name":"Simple Salad Dressing","category":"Snack","difficulty":"Easy","minutes":10,"page":53,"image":"assets/recipes/page-53.webp","source":"Power of Pulses Recipe Book","ingredients":["simple","salad","dressing"]},{"id":"r049","name":"Black Eyed Peas Hummus","category":"Snack","difficulty":"Easy","minutes":10,"page":54,"image":"assets/recipes/page-54.webp","source":"Power of Pulses Recipe Book","ingredients":["black","eyed","peas","hummus"]},{"id":"r050","name":"Pigeon Pea Hummus","category":"Snack","difficulty":"Easy","minutes":10,"page":55,"image":"assets/recipes/page-55.webp","source":"Power of Pulses Recipe Book","ingredients":["pigeon","hummus"]},{"id":"r051","name":"Pigeon Pea Salad with Roasted Butternut Squash","category":"Snack","difficulty":"Easy","minutes":15,"page":56,"image":"assets/recipes/page-56.webp","source":"Power of Pulses Recipe Book","ingredients":["pigeon","salad","with","roasted","butternut","squash"]},{"id":"r052","name":"Fritter Ranch","category":"Snack","difficulty":"Easy","minutes":10,"page":57,"image":"assets/recipes/page-57.webp","source":"Power of Pulses Recipe Book","ingredients":["fritter","ranch"]},{"id":"r053","name":"Pinto Bean Fritters","category":"Snack","difficulty":"Medium","minutes":15,"page":59,"image":"assets/recipes/page-59.webp","source":"Power of Pulses Recipe Book","ingredients":["pinto","bean","fritters"]},{"id":"r054","name":"Pinto Bean Casserole - Bonus","category":"Dinner","difficulty":"Medium","minutes":20,"page":61,"image":"assets/recipes/page-61.webp","source":"Power of Pulses Recipe Book","ingredients":["pinto","bean","casserole","bonus"]},{"id":"r055","name":"Sweet Cinnamon Agave Pinto Bean Cake","category":"Dessert","difficulty":"Medium","minutes":45,"page":63,"image":"assets/recipes/page-63.webp","source":"Power of Pulses Recipe Book","ingredients":["sweet","cinnamon","agave","pinto","bean","cake"]}];
const $=id=>document.getElementById(id);
let activeRecipe=null;
function escapeHtml(value){return String(value??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function parseTerms(){return $('q').value.toLowerCase().split(/[ ,;+]+/).map(s=>s.trim()).filter(Boolean);}
function recipeText(r){return [r.name,r.category,r.difficulty,...(r.ingredients||[])].join(' ').toLowerCase();}
function getFiltered(){const terms=parseTerms(),mode=$('match').value,cat=$('cat').value,diff=$('diff').value,max=Number($('time').value)||9999;return recipes.filter(r=>{const hay=recipeText(r);const textOK=!terms.length||(mode==='all'?terms.every(t=>hay.includes(t)):terms.some(t=>hay.includes(t)));return textOK&&(!cat||r.category===cat)&&(!diff||r.difficulty===diff)&&Number(r.minutes)<=max;});}
function renderChips(){const terms=parseTerms();$('chips').innerHTML=terms.map(t=>`<button class="chip" type="button" data-remove="${escapeHtml(t)}">${escapeHtml(t)} ×</button>`).join('');}
function render(){const list=getFiltered();$('status').textContent=`${list.length} of ${recipes.length} recipes found`;$('grid').innerHTML=list.length?list.map(r=>`<article class="card"><img loading="lazy" src="${escapeHtml(r.image)}" alt="${escapeHtml(r.name)}"><div class="body"><div class="tags"><span class="tag">${escapeHtml(r.category)}</span><span class="tag">${escapeHtml(r.difficulty)}</span><span class="tag">${escapeHtml(r.minutes)} min</span></div><h2>${escapeHtml(r.name)}</h2><p class="ingredients">${escapeHtml((r.ingredients||[]).join(' • '))}</p><button class="primary" type="button" data-open="${escapeHtml(r.id)}">View recipe & plan</button></div></article>`).join(''):'<div class="empty">No matching recipes. Try Match ANY or remove one search term.</div>';renderChips();}
function openRecipe(id){activeRecipe=recipes.find(r=>r.id===id);if(!activeRecipe)return;$('detailName').textContent=activeRecipe.name;$('detailImg').src=activeRecipe.image;$('detailImg').alt=activeRecipe.name;$('detailMeta').innerHTML=`<span class="tag">${escapeHtml(activeRecipe.category)}</span><span class="tag">${escapeHtml(activeRecipe.difficulty)}</span><span class="tag">${escapeHtml(activeRecipe.minutes)} min</span>`;$('detailIngredients').textContent=(activeRecipe.ingredients||[]).join(' • ');let saved={};try{saved=JSON.parse(localStorage.getItem('pulse-plan-'+id)||'{}')}catch(e){}$('prepDate').value=saved.prepDate||'';$('madeDate').value=saved.madeDate||'';$('notes').value=saved.notes||'';$('dlg').showModal();}
function savePlan(){if(!activeRecipe)return;const data={prepDate:$('prepDate').value,madeDate:$('madeDate').value,notes:$('notes').value};localStorage.setItem('pulse-plan-'+activeRecipe.id,JSON.stringify(data));$('saveBtn').textContent='Saved ✓';setTimeout(()=>$('saveBtn').textContent='Save plan',1200);}
function icsEscape(s){return String(s||'').split('\\').join('\\\\').split(',').join('\\,').split(';').join('\\;').replace(/\r?\n/g,'\\n');}
function exportCalendar(){
  if(!activeRecipe)return;
  const date=$('prepDate').value;
  if(!date){alert('Choose a Plan to prepare on date first.');$('prepDate').focus();return;}
  const parts=date.split('-').map(Number);
  const next=new Date(Date.UTC(parts[0],parts[1]-1,parts[2]+1));
  const pad=n=>String(n).padStart(2,'0');
  const start=date.replaceAll('-','');
  const end=String(next.getUTCFullYear())+pad(next.getUTCMonth()+1)+pad(next.getUTCDate());
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');
  const lines=[
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Power of Pulses//Recipe Planner//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+activeRecipe.id+'-'+Date.now()+'@powerofpulses','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+start,'DTEND;VALUE=DATE:'+end,
    'SUMMARY:'+icsEscape('Prepare '+activeRecipe.name),'DESCRIPTION:'+icsEscape($('notes').value||'Power of Pulses recipe'),
    'END:VEVENT','END:VCALENDAR'
  ];
  const blob=new Blob([lines.join(String.fromCharCode(13,10))],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob), link=document.createElement('a');
  link.href=url;
  link.download=activeRecipe.name.replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()+'.ics';
  document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function clearSearch(){$('q').value='';$('match').value='all';$('cat').value='';$('diff').value='';$('time').value='9999';render();}
[...new Set(recipes.map(r=>r.category))].filter(Boolean).sort().forEach(c=>{const o=document.createElement('option');o.textContent=c;o.value=c;$('cat').appendChild(o);});
$('searchBtn').addEventListener('click',render);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();render();}});
$('q').addEventListener('input',render);
['match','cat','diff','time'].forEach(id=>$(id).addEventListener('change',render));
$('clearBtn').addEventListener('click',clearSearch);
$('chips').addEventListener('click',e=>{const b=e.target.closest('[data-remove]');if(!b)return;const remove=b.dataset.remove;$('q').value=parseTerms().filter(t=>t!==remove).join(' ');render();});
$('grid').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openRecipe(b.dataset.open);});
$('closeBtn').addEventListener('click',()=>$('dlg').close());
$('saveBtn').addEventListener('click',savePlan);
$('calendarBtn').addEventListener('click',exportCalendar);
$('dlg').addEventListener('click',e=>{if(e.target===$('dlg'))$('dlg').close();});
render();
</script>
</body></html>
